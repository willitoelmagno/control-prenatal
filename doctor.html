<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Médico — Control Prenatal</title>
<style>
  :root{
    --rosa:#3f7cac; --lila:#2f5f8a; --fondo:#eef4fa; --card:#fff; --borde:#d6e3f0;
    --texto:#1f2d3a; --ok:#2f9e6f; --alerta:#d9463c; --amarillo:#c98a1c; --muted:#5f7385;
  }
  html[data-theme="dark"]{
    --rosa:#6fa8dc; --lila:#8fc0ea; --fondo:#141c26; --card:#1d2735; --borde:#2c3a4c;
    --texto:#e7eef6; --ok:#5fce9a; --alerta:#ee7a70; --amarillo:#e0ab52; --muted:#93a5b8;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--fondo); color:var(--texto);}
  header{background:linear-gradient(135deg,var(--rosa),var(--lila)); color:#fff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center;}
  header h1{margin:0; font-size:1.2rem;}
  .modo-btn{width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.25); border:none; color:#fff; font-size:1.1rem; cursor:pointer;}
  .layout{display:flex; min-height:calc(100vh - 60px);}
  .lista{width:320px; background:var(--card); border-right:1px solid var(--borde); overflow-y:auto; flex:none;}
  .lista .item{padding:14px 18px; border-bottom:1px solid var(--borde); cursor:pointer;}
  .lista .item:hover{background:var(--fondo);}
  .lista .item.sel{background:var(--fondo); border-left:4px solid var(--rosa);}
  .lista .item b{display:block; font-size:.95rem;}
  .lista .item .meta{font-size:.75rem; color:var(--muted);}
  .lista .badge{display:inline-block; font-size:.68rem; padding:2px 8px; border-radius:999px; margin-top:4px;}
  .badge.alerta{background:#fbe4e2; color:var(--alerta);}
  .badge.ok{background:#e2f4ea; color:var(--ok);}
  html[data-theme="dark"] .badge.alerta{background:#3d2321;}
  html[data-theme="dark"] .badge.ok{background:#1f3a2c;}
  .detalle{flex:1; padding:22px 28px; overflow-y:auto;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px;}
  .box{background:var(--card); border:1px solid var(--borde); border-radius:14px; padding:16px 18px;}
  .box h3{margin:0 0 10px; font-size:.95rem; color:var(--lila);}
  .box ul{margin:0; padding-left:18px; font-size:.88rem; line-height:1.6;}
  .box p{margin:4px 0; font-size:.88rem;}
  .pendiente{color:var(--amarillo); font-weight:600;}
  .hecho{color:var(--ok); font-weight:600;}
  .alarma-si{color:var(--alerta); font-weight:700;}
  .nota{font-size:.76rem; color:var(--muted); margin-top:6px;}
  textarea#mensajeFinal{
    width:100%; min-height:360px; font-family:'Consolas',monospace; font-size:.85rem;
    padding:14px; border-radius:12px; border:1.5px solid var(--borde); line-height:1.5;
    background:var(--card); color:var(--texto);
  }
  .btn{padding:10px 18px; border:none; border-radius:10px; background:var(--rosa); color:#fff; font-weight:700; cursor:pointer; margin-top:10px;}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--borde); color:var(--texto);}
  .top-ga{font-size:1.4rem; font-weight:800; color:var(--rosa);}
  .empty{padding:60px; text-align:center; color:var(--muted);}
  .cfg{padding:10px 24px; font-size:.8rem; background:#fff3e0; color:#8a6d3b;}
  select.estado{padding:4px 8px; border-radius:8px; border:1px solid var(--borde); background:var(--card); color:var(--texto); font-size:.78rem;}
  .cond-row{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--borde);}
  .cond-row:last-child{border-bottom:none;}
  svg.chart{width:100%; height:120px; overflow:visible;}
  .accesos-toggle{font-size:.75rem; color:var(--muted); cursor:pointer; text-decoration:underline; margin-top:8px; display:inline-block;}
  .fila-ga{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px;}
  .fila-ga input{padding:8px 10px; border-radius:8px; border:1px solid var(--borde); background:var(--card); color:var(--texto); font-size:.85rem;}
  .fila-ga .btn{margin-top:0;}
  .fecha-bar{padding:12px 16px; border-bottom:1px solid var(--borde); background:var(--fondo);}
  .fecha-tabs{display:flex; gap:6px;}
  .fecha-tabs button{flex:1; padding:7px 4px; border:1px solid var(--borde); background:var(--card); color:var(--texto); border-radius:8px; font-size:.8rem; cursor:pointer;}
  .fecha-tabs button.activo{background:var(--rosa); border-color:var(--rosa); color:#fff; font-weight:700;}
  .fecha-resumen{font-size:.72rem; color:var(--muted); margin-top:8px;}

  /* ============ Buscador ============ */
  .buscador{padding:10px 12px 0;}
  .buscador input{width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--borde); background:var(--fondo); color:var(--texto); font-size:.85rem;}

  /* ============ Resumen fijo (barra superior de la paciente) ============ */
  .resumen-fijo{
    position:sticky; top:0; z-index:3; background:var(--card); border-bottom:1px solid var(--borde);
    padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:-22px -28px 16px;
  }
  .resumen-fijo .nombre{font-size:1.1rem; font-weight:800;}
  .resumen-fijo .ga-num{font-size:1.4rem; font-weight:800; color:var(--rosa);}
  .resumen-fijo .sub{font-size:.74rem; color:var(--muted);}
  .chip-alarma{padding:6px 14px; border-radius:999px; font-size:.78rem; font-weight:700; white-space:nowrap;}
  .chip-alarma.si{background:#fbe4e2; color:var(--alerta);}
  .chip-alarma.no{background:#dcf1e6; color:var(--ok);}

  /* ============ Pendientes unificado ============ */
  .pendientes-hoy{background:var(--card); border:1.5px solid var(--rosa); border-radius:16px; padding:16px 18px; margin-bottom:16px;}
  .pendientes-hoy h3{margin:0 0 10px; font-size:.95rem; color:var(--lila);}
  .pend-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
  .pend-tile{background:var(--fondo); border-radius:12px; padding:10px 12px;}
  .pend-tile .n{font-size:1.3rem; font-weight:800; color:var(--amarillo);}
  .pend-tile .n.cero{color:var(--ok);}
  .pend-tile .lbl{font-size:.72rem; color:var(--muted);}

  /* ============ Tarjetas SOAP ============ */
  .soap-header{display:flex; justify-content:space-between; align-items:center; margin:6px 0 10px;}
  .soap-header h3{margin:0; font-size:1rem;}
  .soap-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px;}
  .soap-card{background:var(--card); border-radius:14px; padding:15px 17px; border-left:5px solid var(--c); border-top:1px solid var(--borde); border-right:1px solid var(--borde); border-bottom:1px solid var(--borde);}
  .soap-card.s{--c:#3f7cac;} html[data-theme="dark"] .soap-card.s{--c:#6fa8dc;}
  .soap-card.o{--c:#2f9e6f;} html[data-theme="dark"] .soap-card.o{--c:#5fce9a;}
  .soap-card.a{--c:#c98a1c;} html[data-theme="dark"] .soap-card.a{--c:#e0ab52;}
  .soap-card.p{--c:#a15fc9; grid-column:1/-1;} html[data-theme="dark"] .soap-card.p{--c:#c99ae0;}
  .soap-card .letra{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:var(--c); color:#fff; font-weight:800; font-size:.8rem; margin-right:8px;}
  .soap-card .titulo{font-weight:700; font-size:.9rem; vertical-align:middle;}
  .soap-card p{font-size:.85rem; margin:8px 0 0; line-height:1.55;}
  .soap-card ul{margin:8px 0 0; padding-left:20px; font-size:.85rem; line-height:1.6;}
  .soap-card .subtitulo{font-size:.76rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:12px;}
  .soap-card .destacado{background:var(--fondo); border-radius:10px; padding:10px 12px; margin-top:10px; font-size:.83rem;}
  .soap-card.quirurgico{border-left-color:var(--alerta);}
  .soap-card.quirurgico .letra{background:var(--alerta);}
  .pill-riesgo{display:inline-block; background:#fbe4e2; color:var(--alerta); font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:999px; margin-top:6px;}
  html[data-theme="dark"] .pill-riesgo{background:#3d2321;}

  /* ============ switches doctor (cesárea / ligadura) ============ */
  .switch-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:.85rem;}
  .switch{position:relative; width:44px; height:24px; flex:none;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .slider{position:absolute; inset:0; background:var(--borde); border-radius:30px; cursor:pointer; transition:.2s;}
  .switch .slider:before{content:""; position:absolute; height:18px; width:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
  .switch input:checked + .slider{background:var(--rosa);}
  .switch input:checked + .slider:before{transform:translateX(20px);}
  .btn-outline{padding:8px 14px; border:1.5px dashed var(--rosa); background:transparent; color:var(--lila); border-radius:10px; font-size:.8rem; font-weight:700; cursor:pointer; margin-top:8px;}
</style>
</head>
<body>
<header>
  <h1>🩺 Panel Médico — Control Prenatal</h1>
  <button class="modo-btn" onclick="toggleModo()" id="btnModo">🌙</button>
</header>
<div class="cfg" id="cfgWarn"></div>
<div class="layout">
  <div class="lista">
    <div class="buscador"><input type="text" id="buscadorInput" oninput="cambiarFiltroTexto(this.value)" placeholder="🔍 Buscar por nombre o DNI..."></div>
    <div id="fechaTabs"></div>
    <div id="listaItems"><div class="empty">Cargando pacientes…</div></div>
  </div>
  <div class="detalle" id="detalle"><div class="empty">Selecciona una paciente de la lista</div></div>
</div>

<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxQ-IDYNgKZ_Ox_5RLMm8WjiMMDaE0tOLBUzf46wRmDJiW4OthlgKHE3FoVjqyixVH96A/exec";
const SESION_HORAS = 8; // la clave se vuelve a pedir después de este tiempo de inactividad de sesión
let consultas = [];
let filtroFecha = 'hoy'; // 'hoy' | 'todas'
let filtroTexto = '';

// Especialidad sugerida según la condición médica registrada por la paciente.
// Se muestra junto a la interconsulta para que sepas a qué especialista referirla.
const CONDICION_ESPECIALIDAD = {
  'Diabetes gestacional/pregestacional': 'Endocrinología',
  'Hipotiroidismo': 'Endocrinología',
  'Hipertensión crónica': 'Cardiología',
  'Cardiopatía': 'Cardiología',
  'Asma / enfermedad pulmonar': 'Neumología',
  'Enfermedad renal': 'Nefrología',
  'Enfermedad autoinmune (lupus, etc.)': 'Reumatología'
};

/* ============ MODO OSCURO ============ */
function toggleModo(){
  const html = document.documentElement;
  const nuevo = html.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', nuevo);
  document.getElementById('btnModo').textContent = nuevo==='dark' ? '☀️' : '🌙';
  try{ localStorage.setItem('modoOscuroDoctor', nuevo); }catch(e){}
}
(function initModo(){
  let pref = null;
  try{ pref = localStorage.getItem('modoOscuroDoctor'); }catch(e){}
  if(!pref){ pref = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  document.documentElement.setAttribute('data-theme', pref);
  document.getElementById('btnModo').textContent = pref==='dark' ? '☀️' : '🌙';
})();

if(WEBAPP_URL.indexOf('PEGA_AQUI')>=0){
  document.getElementById('cfgWarn').textContent = '⚠️ Configura WEBAPP_URL en este archivo con la URL de tu Apps Script (ver Code.gs).';
} else {
  document.getElementById('cfgWarn').style.display='none';
}

/* ============ CLAVE CON EXPIRACIÓN ============ */
// Por seguridad (datos médicos), la clave guardada en este navegador expira
// sola después de SESION_HORAS horas. Pasado ese tiempo se vuelve a pedir.
function getClave(){
  let sesion = null;
  try{ sesion = JSON.parse(localStorage.getItem('sesionDoctor') || 'null'); }catch(e){}
  const ahora = Date.now();
  if(sesion && sesion.clave && (ahora - sesion.ts) < SESION_HORAS*60*60*1000){
    return sesion.clave;
  }
  const clave = prompt('Ingresa tu clave de acceso al panel:') || '';
  try{ localStorage.setItem('sesionDoctor', JSON.stringify({clave, ts: ahora})); }catch(e){}
  return clave;
}
function cerrarSesion(){
  try{ localStorage.removeItem('sesionDoctor'); }catch(e){}
  location.reload();
}

async function cargar(){
  try{
    const clave = getClave();
    const res = await fetch(`${WEBAPP_URL}?accion=listarConsultas&clave=${encodeURIComponent(clave)}`);
    const json = await res.json();
    if(!json.ok){
      try{ localStorage.removeItem('sesionDoctor'); }catch(e){}
      document.getElementById('lista').innerHTML = '<div class="empty">Clave incorrecta. Recarga la página e inténtalo de nuevo.<br><span class="nota">Los intentos fallidos quedan registrados.</span></div>';
      return;
    }
    consultas = json.consultas || [];
    pintarLista();
  }catch(e){
    document.getElementById('lista').innerHTML = '<div class="empty">No se pudo conectar. Revisa WEBAPP_URL.</div>';
  }
}

function tieneAlarma(c){
  return ['sangrado','perdidaLiquido','cefalea','visionBorrosa','dolorEpigastrico','tinnitus','escotomas']
    .some(k => c[k]==='si') || c.movimientosFetales==='no';
}

function esHoy(timestamp){
  if(!timestamp) return false;
  const f = new Date(timestamp);
  const hoy = new Date();
  return f.getFullYear()===hoy.getFullYear() && f.getMonth()===hoy.getMonth() && f.getDate()===hoy.getDate();
}

function cambiarFiltroFecha(valor){
  filtroFecha = valor;
  pintarLista();
}

function cambiarFiltroTexto(valor){
  filtroTexto = valor;
  pintarListaItems(); // solo repinta los resultados, sin tocar el input (mantiene el foco al escribir)
}

function pasaFiltroTexto(c, texto){
  if(!texto) return true;
  const t = texto.trim().toLowerCase();
  if(!t) return true;
  return String(c.nombre||'').toLowerCase().includes(t) || String(c.dni||'').toLowerCase().includes(t);
}

function pintarLista(){
  document.getElementById('fechaTabs').innerHTML = `
    <div class="fecha-bar">
      <div class="fecha-tabs">
        <button class="${filtroFecha==='hoy'?'activo':''}" onclick="cambiarFiltroFecha('hoy')">Hoy</button>
        <button class="${filtroFecha==='todas'?'activo':''}" onclick="cambiarFiltroFecha('todas')">Todas</button>
      </div>
    </div>`;
  pintarListaItems();
}

function pintarListaItems(){
  const el = document.getElementById('listaItems');
  const base = filtroFecha==='hoy' ? consultas.filter(c=>esHoy(c.timestamp)) : consultas;
  const visibles = base.filter(c=>pasaFiltroTexto(c, filtroTexto));

  let html = `<div class="fecha-resumen" style="padding:0 16px 8px">${visibles.length} paciente${visibles.length===1?'':'s'}${filtroTexto ? ' encontrada'+(visibles.length===1?'':'s') : (filtroFecha==='hoy' ? ' registrada'+(visibles.length===1?'':'s')+' hoy' : ' en total')}</div>`;

  if(!visibles.length){
    html += `<div class="empty">${filtroTexto ? 'Sin resultados para tu búsqueda' : (filtroFecha==='hoy' ? 'Aún no hay registros de hoy' : 'Aún no hay registros')}</div>`;
  } else {
    html += visibles.map((c)=>{
      const i = consultas.indexOf(c);
      const alarma = tieneAlarma(c);
      const ga = calcularGAHoy(c);
      const gaTxt = ga.sinReferencia ? 'GA sin registrar' : `${ga.semanas}sem+${ga.dias}d`;
      return `<div class="item" onclick="verDetalle(${i})" id="item${i}">
        <b>${c.nombre}</b>
        <span class="meta">DNI ${c.dni} · ${gaTxt}</span>
        <div class="badge ${alarma?'alerta':'ok'}">${alarma?'⚠ Revisar síntomas':'Sin alarma'}</div>
      </div>`;
    }).join('');
  }
  html += `<div style="padding:14px 18px"><span class="accesos-toggle" onclick="cerrarSesion()">Cerrar sesión ahora</span></div>`;
  el.innerHTML = html;
}

async function verDetalle(i){
  document.querySelectorAll('.item').forEach(e=>e.classList.remove('sel'));
  document.getElementById('item'+i).classList.add('sel');
  const c = consultas[i];
  const ga = calcularGAHoy(c);
  const rec = generarRecomendaciones(ga, c);
  const comp = generarComponentesSOAP(c, ga, rec);
  const alarma = tieneAlarma(c);
  let condiciones = [];
  try{ condiciones = JSON.parse(c.condicionesJSON||'[]'); }catch(e){}
  let labs = [];
  try{ labs = JSON.parse(c.laboratoriosJSON||'[]'); }catch(e){}

  const pendLabsN = ga.sinReferencia ? 0 : rec.labs.length;
  const pendImgN = ga.sinReferencia ? 0 : rec.imagenes.filter(t=>t!=='Sin estudio de imagen pendiente por semana actual').length;
  const pendVacN = rec.vacunas.filter(v=>!v.hecha).length;
  const pendIntN = 3 + rec.interconsultasExtra.length + condiciones.filter(cd=>cd.estado==='pendiente').length;

  document.getElementById('detalle').innerHTML = `
    <div class="resumen-fijo">
      <div>
        <div class="nombre">${c.nombre} <span style="font-weight:400;color:var(--muted);font-size:.8rem">DNI ${c.dni}</span></div>
        <div class="sub">${ga.sinReferencia ? 'Edad gestacional aún no registrada' : `Eco de referencia: ${c.fechaEcoReferencia} (${c.semanasEcoReferencia} sem+${c.diasEcoReferencia||0}d) · FPP: ${c.fpp||'—'} · Próximo control: ${comp.proximoTxt}`}</div>
      </div>
      <div style="display:flex; align-items:center; gap:14px">
        ${!ga.sinReferencia ? `<div style="text-align:right"><div class="ga-num">${ga.semanas}<span style="font-size:.85rem"> sem+${ga.dias}d</span></div><div class="sub">${comp.trimestreLabel}</div></div>` : ''}
        <div class="chip-alarma ${alarma?'si':'no'}">${alarma?'⚠ Revisar síntomas':'✓ Sin alarma hoy'}</div>
      </div>
    </div>

    <div class="pendientes-hoy">
      <h3>📌 Pendientes de esta paciente</h3>
      <div class="pend-grid">
        <div class="pend-tile"><div class="n ${pendLabsN===0?'cero':''}">${pendLabsN}</div><div class="lbl">Laboratorios pendientes</div></div>
        <div class="pend-tile"><div class="n ${pendImgN===0?'cero':''}">${pendImgN}</div><div class="lbl">Imágenes pendientes</div></div>
        <div class="pend-tile"><div class="n ${pendVacN===0?'cero':''}">${pendVacN}</div><div class="lbl">Vacunas pendientes</div></div>
        <div class="pend-tile"><div class="n">${pendIntN}</div><div class="lbl">Interconsultas</div></div>
      </div>
    </div>

    <div class="pendientes-hoy" style="border-color:var(--lila)">
      <h3>📐 Edad gestacional de referencia</h3>
      <p class="nota" style="margin:0 0 8px">Institucionalmente no se usa la FUM. La fija el médico una sola vez (habitualmente con la ecografía del 1er trimestre) y el sistema calcula la GA hacia adelante en esta y en las próximas consultas.</p>
      <div id="formGA">${formularioReferenciaGA(c)}</div>
    </div>

    <div class="soap-header"><h3>📋 Nota clínica del control de hoy</h3><button class="btn" onclick="copiarNotaCompleta()">Copiar nota completa</button></div>
    <textarea id="mensajeFinal" readonly style="position:absolute; left:-9999px; top:-9999px;">${textoSOAPCompleto(c, comp)}</textarea>
    <div class="soap-grid">
      <div class="soap-card s">
        <span class="letra">S</span><span class="titulo">Subjetivo</span>
        <p>${comp.sTxt}</p>
        ${comp.labsSubjetivoTxt ? `<p>${comp.labsSubjetivoTxt}</p>` : ''}
      </div>
      <div class="soap-card o">
        <span class="letra">O</span><span class="titulo">Objetivo</span>
        <p>${comp.oTxt}</p>
      </div>
      <div class="soap-card a">
        <span class="letra">A</span><span class="titulo">Análisis</span>
        <p>${comp.aTxt}</p>
        ${comp.riesgoPE ? `<div class="pill-riesgo">Riesgo de preeclampsia: ${comp.riesgoPE.join(', ')}</div>` : ''}
      </div>
      <div class="soap-card p">
        <span class="letra">P</span><span class="titulo">Plan</span>
        <p class="subtitulo">Adaptado a la semana actual</p>
        <p>${comp.hitosTxt}</p>

        <p class="subtitulo">Indicaciones</p>
        <ul>${comp.indicaciones.map(t=>`<li>${t}</li>`).join('')}</ul>

        <p class="subtitulo">Pendientes</p>
        <ul>
          <li>Labs: ${rec.labs.join('; ')}</li>
          <li>Imágenes: ${rec.imagenes.join('; ')}</li>
          <li>Vacunas: ${rec.vacunas.filter(v=>!v.hecha).map(v=>v.texto).join('; ') || 'al día'}</li>
          <li>Interconsultas: Nutrición; Odontología; Psicología (tamizaje)${rec.interconsultasExtra.length ? '; '+rec.interconsultasExtra.join('; '):''}${condiciones.filter(cd=>cd.estado==='pendiente').length ? '; '+condiciones.filter(cd=>cd.estado==='pendiente').map(cd=>{const e=CONDICION_ESPECIALIDAD[cd.nombre]; return e?`${cd.nombre} → ${e}`:cd.nombre;}).join('; ') : ''}</li>
        </ul>

/* ============ El médico agrega una condición/patología detectada en consulta ============ */
function agregarCondicion(dni){
  const opciones = Object.keys(CONDICION_ESPECIALIDAD);
  const listaTxt = opciones.map((o,idx)=>`${idx+1}. ${o}`).join('\n');
  const seleccion = prompt(`¿Qué condición detectaste hoy? Escribe el número de la lista, o escribe el nombre si no está listada:\n\n${listaTxt}`);
  if(!seleccion) return;
  const idx = parseInt(seleccion, 10);
  const nombre = (!isNaN(idx) && opciones[idx-1]) ? opciones[idx-1] : seleccion.trim();
  if(!nombre) return;

  const c = consultas.find(x=>String(x.dni)===String(dni));
  if(!c) return;
  let condiciones = [];
  try{ condiciones = JSON.parse(c.condicionesJSON||'[]'); }catch(e){}
  condiciones.push({ nombre, estado:'pendiente' });
  const nuevoJSON = JSON.stringify(condiciones);
  c.condicionesJSON = nuevoJSON;

  (async()=>{
    let sesion = null;
    try{ sesion = JSON.parse(localStorage.getItem('sesionDoctor')||'null'); }catch(e){}
    const clave = sesion ? sesion.clave : '';
    try{
      await fetch(WEBAPP_URL, {method:'POST', body: JSON.stringify({accion:'actualizarCondiciones', clave, dni, condiciones: nuevoJSON})});
    }catch(e){ /* si falla, se puede reintentar; queda en memoria por ahora */ }
    const i = consultas.indexOf(c);
    if(i>=0) verDetalle(i);
  })();
}

/* ============ El médico marca cesárea previa/programada y/o deseo de ligadura ============ */
async function actualizarDatosMedico(dni, cesareaChecked, ligaduraChecked){
  const c = consultas.find(x=>String(x.dni)===String(dni));
  if(!c) return;
  const cesareaPrevia = cesareaChecked!==undefined ? (cesareaChecked?'si':'no') : (c.cesareaPrevia||'no');
  const deseaLigadura = ligaduraChecked!==undefined ? (ligaduraChecked?'si':'no') : (c.deseaLigadura||'no');
  c.cesareaPrevia = cesareaPrevia;
  c.deseaLigadura = deseaLigadura;
  consultas.forEach(x=>{ if(String(x.dni)===String(dni)){ x.cesareaPrevia = cesareaPrevia; x.deseaLigadura = deseaLigadura; } });

  let sesion = null;
  try{ sesion = JSON.parse(localStorage.getItem('sesionDoctor')||'null'); }catch(e){}
  const clave = sesion ? sesion.clave : '';
  try{
    await fetch(WEBAPP_URL, {method:'POST', body: JSON.stringify({accion:'actualizarDatosMedico', clave, dni, cesareaPrevia, deseaLigadura})});
  }catch(e){ /* si falla, queda en memoria y se puede reintentar */ }
  const i = consultas.indexOf(c);
  if(i>=0) verDetalle(i);
}

async function guardarReferenciaGA(dni){
  const fecha = document.getElementById('ga_fecha').value;
  const semanas = document.getElementById('ga_semanas').value;
  const dias = document.getElementById('ga_dias').value || 0;
  if(!fecha || semanas===''){ alert('Ingresa la fecha de la ecografía y las semanas'); return; }
  const fpp = calcularFPPDesde(fecha, semanas, dias);
  let sesion = null;
  try{ sesion = JSON.parse(localStorage.getItem('sesionDoctor')||'null'); }catch(e){}
  const clave = sesion ? sesion.clave : '';
  try{
    const res = await fetch(WEBAPP_URL, {method:'POST', body: JSON.stringify({
      accion:'guardarReferenciaGA', clave, dni,
      fechaEcoReferencia: fecha, semanasEcoReferencia: semanas, diasEcoReferencia: dias, fpp
    })});
    const json = await res.json();
    if(!json.ok){ alert('No se pudo guardar: ' + (json.error||'error desconocido') + '. Si tu sesión expiró, recarga la página.'); return; }
  }catch(e){ alert('No se pudo guardar. Verifica tu conexión e inténtalo de nuevo.'); return; }
  // actualiza en memoria todas las consultas de esa paciente para que se recalculen al vuelo
  // (dni puede llegar como string desde el onclick y c.dni como number desde la hoja: comparar como texto)
  consultas.forEach(c=>{
    if(String(c.dni)===String(dni)){
      c.fechaEcoReferencia = fecha; c.semanasEcoReferencia = semanas; c.diasEcoReferencia = dias; c.fpp = fpp;
    }
  });
  const idx = consultas.findIndex(c=>String(c.dni)===String(dni));
  if(idx>=0) verDetalle(idx);
  else alert('Se guardó, pero no se pudo refrescar la vista automáticamente. Vuelve a abrir la ficha de la paciente.');
}

      <p class="nota" style="margin-top:10px">Curva de presión sistólica (mmHg)</p>
      ${chartSVG(hist.map(h=>parseFloat(h.presionSistolica)).filter(v=>!isNaN(v)))}
    `;
  }catch(e){
    el.innerHTML = '<p class="nota">No se pudo cargar el historial.</p>';
  }
}

function chartSVG(valores){
  if(!valores.length) return '<p class="nota">Sin datos suficientes</p>';
  const w = 280, h = 90, pad = 8;
  const min = Math.min(...valores), max = Math.max(...valores);
  const rango = (max-min) || 1;
  const pts = valores.map((v,i)=>{
    const x = pad + (i*(w-2*pad)/Math.max(1,valores.length-1));
    const y = h - pad - ((v-min)/rango)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="var(--rosa,#d16b96)" stroke-width="2.5" />
    ${valores.map((v,i)=>{
      const x = pad + (i*(w-2*pad)/Math.max(1,valores.length-1));
      const y = h - pad - ((v-min)/rango)*(h-2*pad);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#d16b96"/>`;
    }).join('')}
  </svg>`;
}

function sintomaLinea(label, val, normalEsSi){
  const esAlarma = normalEsSi ? val==='no' : val==='si';
  return `<p>${label}: <span class="${esAlarma?'alarma-si':''}">${val==='si'?'Sí':'No'}</span></p>`;
}

function calcularGAHoy(c){
  if(!c.fechaEcoReferencia || c.semanasEcoReferencia===''||c.semanasEcoReferencia===undefined){
    return { semanas:0, dias:0, diasTotal:0, sinReferencia:true };
  }
  const fechaRef = new Date(c.fechaEcoReferencia+'T00:00:00');
  const hoy = new Date();
  const diasTranscurridos = Math.max(0, Math.floor((hoy-fechaRef)/(1000*60*60*24)));
  const diasTotalesRef = (Number(c.semanasEcoReferencia)*7) + Number(c.diasEcoReferencia||0);
  const diasTotalHoy = diasTotalesRef + diasTranscurridos;
  return { semanas: Math.floor(diasTotalHoy/7), dias: diasTotalHoy%7, diasTotal: diasTotalHoy, sinReferencia:false };
}

function calcularFPPDesde(fechaEcoStr, semanas, dias){
  const fechaEco = new Date(fechaEcoStr+'T00:00:00');
  const diasHastaTermino = 280 - ((Number(semanas)*7) + Number(dias||0));
  const fpp = new Date(fechaEco.getTime() + diasHastaTermino*24*60*60*1000);
  return fpp.toISOString().split('T')[0];
}

/* ============ MOTOR DE RECOMENDACIONES (esquema MINSA Perú + evidencia reciente) ============ */
function generarRecomendaciones(ga, c){
  if(ga.sinReferencia){
    return {
      vacunas: [], labs: ['Registra primero la edad gestacional de referencia arriba'],
      imagenes: [], interconsultasExtra: [], quirurgico: [], quirurgicoAplica: false
    };
  }
  const s = ga.semanas;
  const vacunas = [
    { texto:'Influenza estacional (cualquier trimestre)', hecha:false },
    { texto:'Td / Tdap (Tétanos-Difteria-Pertussis) — completar esquema, dosis de refuerzo 27-36 sem', hecha: s<27 },
    { texto:'COVID-19 — vacunación/refuerzo recomendado en cualquier trimestre según esquema vigente MINSA', hecha:false },
    { texto:'Virus respiratorio sincitial (RSV / Abrysvo) 32-36 sem — evidencia reciente (ACOG/CDC), aún no forma parte formal del esquema MINSA: evaluar disponibilidad y criterio clínico', hecha: s<32 }
  ];

  const labs = [];
  if(s < 14){
    labs.push('Hemograma completo, grupo sanguíneo y factor Rh');
    labs.push('Glucosa basal, VIH, sífilis (RPR/VDRL), HBsAg');
    labs.push('Toxoplasmosis IgG/IgM');
    labs.push('Examen de orina completo + urocultivo');
    labs.push('Papanicolaou (si no tiene vigente)');
  } else if(s < 24){
    labs.push('Control de hemograma (descartar anemia)');
    labs.push('Urocultivo de control si sintomática');
  } else if(s < 28){
    labs.push('Prueba de tolerancia a la glucosa (PTOG 75g) 24-28 sem');
    labs.push('Hemograma de control');
  } else if(s < 33){
    labs.push('Hemograma de control (tercer trimestre)');
  } else if(s < 37){
    labs.push('VIH y sífilis (RPR/VDRL) de control — repetir en tercer trimestre');
    labs.push('Cultivo rectovaginal para Estreptococo del grupo B (35-37 sem)');
  } else {
    labs.push('Perfil de coagulación pre-parto');
  }

  const imagenes = [];
  if(s < 14 && c.ecoGenetica !== 'si') imagenes.push('Ecografía genética / translucencia nucal (11-14 sem)');
  if(s >= 14 && s < 24 && c.ecoMorfologica !== 'si') imagenes.push('Ecografía morfológica (20-24 sem)');
  if(s >= 24 && s < 32) imagenes.push('Ecografía de crecimiento fetal (28-32 sem)');
  if(s >= 32 && s < 37) imagenes.push('Ecografía Doppler / perfil biofísico (34-36 sem) si está indicado');
  if(imagenes.length===0) imagenes.push('Sin estudio de imagen pendiente por semana actual');

  const interconsultasExtra = [];
  if(s >= 34 && c.cesareaPrevia==='si') interconsultasExtra.push('Evaluación pre-anestésica (36 sem aprox.)');

  // Bloque quirúrgico: se activa desde la semana 32 si hay cesárea previa/programada.
  // Orden pensado para no saltarse pasos: riesgo → preoperatorios → depósito de
  // sangre → pre-anestesia → consentimiento de ligadura (si aplica, con
  // anticipación) → fecha de cesárea.
  const quirurgicoAplica = s >= 32 && c.cesareaPrevia === 'si';
  const quirurgico = [
    '1. Riesgo quirúrgico: evaluación cardiológica / Medicina Interna preoperatoria',
    '2. Exámenes preoperatorios: hemograma, grupo y factor Rh, PT/TTPA, glucosa, urea, creatinina, VIH, HBsAg (si no vigentes)',
    '3. Orden de depósito de sangre: coordinar reserva con banco de sangre',
    '4. Evaluación pre-anestésica (~36 sem)'
  ];
  if(c.deseaLigadura === 'si'){
    quirurgico.push('5. Consentimiento informado de ligadura tubaria: FIRMAR CON ANTICIPACIÓN, nunca el mismo día de la cirugía');
  }
  quirurgico.push((c.deseaLigadura==='si' ? '6' : '5') + '. Programar fecha de cesárea (idealmente 38-39 sem)');

  return { vacunas, labs, imagenes, interconsultasExtra, quirurgico, quirurgicoAplica };
}

    c.ecoPrevia==='si' ? 'otra ecografía previa realizada' : null
  ].filter(Boolean).join('; ') || 'sin ecografías institucionales registradas aún';
  const oTxt = `${gaObjTxt} Peso: ${c.peso || '—'} kg · Presión arterial: ${c.presionSistolica || '—'}/${c.presionDiastolica || '—'} mmHg. Ecografías: ${ecoTxt}.${c.ecoObservaciones ? ` Obs.: ${c.ecoObservaciones}.` : ''}`;

  /* ---- A ---- */
  const gestaTxt = ga.sinReferencia
    ? 'Gestante con edad gestacional aún no determinada en el sistema.'
    : `Gestante de ${ga.semanas} sem + ${ga.dias} d (${trimestreLabel}), evolución ${alarma ? 'con síntomas de alarma a evaluar' : 'aparentemente favorable, sin signos de alarma en el día'}.`;
  const condTxt = condiciones.length
    ? condiciones.map(cd=>{
        const especialidad = CONDICION_ESPECIALIDAD[cd.nombre];
        const estadoTxt = cd.estado==='pendiente'?'interconsulta pendiente':cd.estado==='en_seguimiento'?'en seguimiento':'atendida';
        return `${cd.nombre}${especialidad?` (${especialidad})`:''} — ${estadoTxt}`;
      }).join('; ')
    : 'sin comorbilidades ni condiciones registradas';
  const riesgoTxt = riesgoPE
    ? `Riesgo de preeclampsia presente: ${riesgoPE.join(', ')}.`
    : 'Sin factores de riesgo de preeclampsia registrados.';
  const aTxt = `${gestaTxt} Comorbilidades/condiciones: ${condTxt}. ${riesgoTxt}`;

  /* ---- P ---- */
  const asaTxt = riesgoPE && !ga.sinReferencia && ga.semanas < 37
    ? 'Ácido acetilsalicílico (aspirina) 150 mg VO por las noches, todos los días (protocolo ASPRE por riesgo de preeclampsia) — hasta la semana 36-37. No suspender salvo indicación médica.'
    : null;
  const folatoTxt = !ga.sinReferencia && ga.semanas >= 14
    ? 'Ácido fólico 1 tableta VO cada 24 horas (mantener; dosis de mayor impacto ya cubierta en el 1er trimestre).'
    : 'Ácido fólico 1 tableta VO cada 24 horas (prioritario en el 1er trimestre, para prevención de defectos del tubo neural).';

  const indicaciones = [
    'Sulfato ferroso (comprimido 300 mg / 60 mg de hierro elemental): 1 comprimido VO cada 24 horas, alejado de las comidas (1 h antes o 2 h después), con jugo cítrico para mejorar la absorción; evitar junto con lácteos o café.',
    folatoTxt,
    'Calcio carbonato 600 mg: 1 comprimido VO cada 24 horas, de preferencia por la noche, separado del sulfato ferroso por al menos 2 horas.',
    'Metildopa 250 mg VO cada 8 horas (solo si hipertensión indicada por su médico).'
  ];
  if(asaTxt) indicaciones.push(asaTxt);

  function hitosSemana(sem){
    if(sem < 11) return 'Confirmación de embarazo, inicio de suplementación con ácido fólico, solicitud de exámenes basales de 1er trimestre.';
    if(sem < 14) return 'Ventana para ecografía genética/translucencia nucal (11-14 sem) y tamizaje combinado de aneuploidías si está disponible.';
    if(sem < 20) return 'Control de síntomas de 1er trimestre (náuseas, fatiga); reforzar adherencia a suplementos.';
    if(sem < 24) return 'Ventana para ecografía morfológica (20-24 sem); momento clave para descartar malformaciones estructurales.';
    if(sem < 28) return 'Tamizaje de diabetes gestacional con PTOG 75g (24-28 sem); iniciar vigilancia estrecha de PA si hay riesgo de preeclampsia.';
    if(sem < 32) return 'Control de crecimiento fetal (ecografía 28-32 sem); reforzar signos de alarma de preeclampsia y trabajo de parto pretérmino.';
    if(sem < 34) return 'Vigilar presentación fetal; evaluar necesidad de Doppler/perfil biofísico si hay factores de riesgo.';
    if(sem < 36) return 'Ventana para vacuna de VRS (si disponible) y refuerzo Tdap si no se colocó antes; se acerca el cultivo rectovaginal para Estreptococo del grupo B (35-37 sem).';
    if(sem < 37) return 'Cultivo rectovaginal para Estreptococo del grupo B (35-37 sem); definir vía de parto si hay indicación quirúrgica.';
    if(sem < 39) return 'Embarazo a término temprano: vigilancia semanal, evaluar bienestar fetal, revisar plan de parto.';
    if(sem < 41) return 'Embarazo a término: vigilancia semanal estrecha, evaluar signos de trabajo de parto.';
    return 'Embarazo en vías de prolongación (≥41 sem): referir para evaluación de bienestar fetal y probable inducción, según protocolo institucional.';
  }
  const hitosTxt = ga.sinReferencia ? 'Registra la edad gestacional de referencia para ver los hitos de la semana actual.' : hitosSemana(ga.semanas);

  const consejeriaTxt = ga.sinReferencia ? '' : (trimestre===1
    ? 'Consejería 1er trimestre: alimentación fraccionada para náuseas, evitar automedicación, actividad física ligera si no hay contraindicación, evitar tabaco/alcohol.'
    : trimestre===2
    ? 'Consejería 2do trimestre: dieta rica en hierro y calcio, actividad física moderada (caminatas), curso de preparación para el parto, vigilar movimientos fetales desde ~20 sem.'
    : 'Consejería 3er trimestre: reconocer signos de trabajo de parto, plan de parto y de traslado, conteo de movimientos fetales diario, posición para dormir (decúbito lateral izquierdo).');

  const pendientesTxt = [
    `Labs: ${rec.labs.join('; ')}`,
    `Imágenes: ${rec.imagenes.join('; ')}`,
    `Vacunas: ${rec.vacunas.filter(v=>!v.hecha).map(v=>v.texto).join('; ') || 'al día'}`,
    `Interconsultas: Nutrición; Odontología; Psicología (tamizaje)${rec.interconsultasExtra.length ? '; '+rec.interconsultasExtra.join('; '):''}${condiciones.filter(cd=>cd.estado==='pendiente').length ? '; '+condiciones.filter(cd=>cd.estado==='pendiente').map(cd=>{const e=CONDICION_ESPECIALIDAD[cd.nombre]; return e?`${cd.nombre} → ${e}`:cd.nombre;}).join('; ') : ''}`
  ];

  const educacionTxt = `Se le explicó a la paciente, en lenguaje claro, que debe acudir de inmediato a Emergencia si presenta: sangrado vaginal, pérdida de líquido por genitales, disminución o ausencia de movimientos fetales, dolor de cabeza intenso que no cede con analgesia habitual, visión borrosa o puntos de luz, dolor fuerte en la boca del estómago, zumbido de oídos o convulsiones.${alarma ? ' Dado que hoy refiere síntomas de alarma, se hizo énfasis adicional en no esperar al siguiente control si estos persisten o empeoran.' : ''} La paciente comprendió las indicaciones, el plan de exámenes pendientes y los signos de alarma, y aceptó continuar con el seguimiento de su embarazo.`;

  const proximoTxt = ga.sinReferencia ? 'A definir (registrar GA de referencia primero).' : (ga.semanas < 28 ? 'En 4 semanas.' : ga.semanas < 36 ? 'En 2 semanas.' : 'En 1 semana.');

  return {
    ga, trimestreLabel, sTxt, labsSubjetivoTxt, oTxt, aTxt, riesgoPE, condTxt,
    indicaciones, hitosTxt, consejeriaTxt, pendientesTxt, educacionTxt, proximoTxt,
    quirurgico: rec.quirurgico, quirurgicoAplica: rec.quirurgicoAplica, alarma
  };
}

function textoSOAPCompleto(c, comp){
  return `CONTROL PRENATAL — NOTA SOAP
${c.nombre} (DNI ${c.dni}) · ${new Date().toLocaleDateString('es-PE')}

S — SUBJETIVO
${comp.sTxt}${comp.labsSubjetivoTxt ? '\n'+comp.labsSubjetivoTxt : ''}

O — OBJETIVO
${comp.oTxt}

A — ANÁLISIS
${comp.aTxt}

P — PLAN
RESUMEN SEGÚN SEMANA ACTUAL: ${comp.hitosTxt}

INDICACIONES:
${comp.indicaciones.map(i=>'- '+i).join('\n')}

PENDIENTES:
${comp.pendientesTxt.map(p=>'- '+p).join('\n')}
${comp.quirurgicoAplica ? '\nPREPARACIÓN QUIRÚRGICA (cesárea, desde sem. 32):\n'+comp.quirurgico.map(v=>'- '+v).join('\n') : ''}
${comp.consejeriaTxt ? '\n'+comp.consejeriaTxt : ''}

EDUCACIÓN A LA PACIENTE:
${comp.educacionTxt}

PRÓXIMO CONTROL: ${comp.proximoTxt}`;
}

cargar();
</script>
